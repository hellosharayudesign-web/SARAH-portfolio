<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sharayu.Design — Home</title>
  <meta name="description" content="Products shaped by research, strategy and execution." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="sy-root">
  <script>
    window.SY_PAGE = "home";
    window.SY_IMG_BASE = "assets/images/";
    window.SY_SKIP_PRELOADER = !!sessionStorage.getItem("sy_preloader_shown");
    if (window.SY_SKIP_PRELOADER) {
      document.write("<style>#sy-preloader{display:none !important;}</style>");
    } else {
      sessionStorage.setItem("sy_preloader_shown", "1");
    }
  </script>

  <div class="sy-preloader" id="sy-preloader">
    <span class="sy-heading sy-gradient-text sy-preloader-text" style="font-size:1.35rem;letter-spacing:0.01em;">sharayu.design</span>
  </div>

  <div id="app"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
